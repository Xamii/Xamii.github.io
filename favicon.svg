<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark background -->
  <rect width="32" height="32" rx="6" fill="#080d14"/>

  <!-- Outer hex ring -->
  <polygon
    points="16,2 27,8.5 27,23.5 16,30 5,23.5 5,8.5"
    fill="none"
    stroke="#00f0ff"
    stroke-width="1.5"
    opacity="0.35"
  />

  <!-- Inner hex -->
  <polygon
    points="16,6 24,10.5 24,21.5 16,26 8,21.5 8,10.5"
    fill="none"
    stroke="#00f0ff"
    stroke-width="1"
    opacity="0.6"
  />

  <!-- Magnifying glass circle -->
  <circle cx="14" cy="14" r="5.5" fill="none" stroke="#00f0ff" stroke-width="2"/>

  <!-- Magnifying glass handle -->
  <line x1="18.2" y1="18.2" x2="23" y2="23" stroke="#00f0ff" stroke-width="2.2" stroke-linecap="round"/>

  <!-- Center dot -->
  <circle cx="14" cy="14" r="1.5" fill="#00f0ff" opacity="0.7"/>

  <!-- Top-right glow dot accent -->
  <circle cx="23" cy="9" r="1.2" fill="#00f0ff" opacity="0.5"/>
</svg>
